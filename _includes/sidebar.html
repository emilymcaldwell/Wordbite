<aside>
  <nav class="sidebar-nav">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>{{ site.title | escape }}</a>

    {% for node in site.pages %}
      {% if node.title and node.layout == "page" %}
        <a href="{{ node.url | relative_url }}" {% if page.url == node.url %}class="active"{% endif %}>{{ node.title }}</a>
      {% endif %}
    {% endfor %}

    <details open>
      <summary>Theme Guides</summary>
      <dl>
        {% for guide in site.guides %}
          <a href="{{ guide.url | relative_url }}" {% if page.url == guide.url %}class="active"{% endif %}>{{ guide.title }}</a>
        {% endfor %}
      </dl>
    </details>

    <details>
      <summary>Notices/Updates</summary>
      <dl>
        {% for post in site.posts %}
          <a href="{{ post.url }}" {% if page.url == post.url %}class="active"{% endif %}>{{ post.title }}</a>
        {% endfor %}
      </dl>
    </details>
  </nav>
</aside>
