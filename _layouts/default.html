<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/styles.css' | relative_url }}">
    <script src="https://cdn.jsdelivr.net/npm/table-sort-js/table-sort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-scrollspy@2.5.3/demo/dist/simple-scrollspy.min.js"></script>
    <script>
    window.onload = function () {
      scrollSpy('#toc', {
        sectionClass: '.scrollspy',
        menuActiveTarget: '.toc-entry',
        offset: 100,
        // smooth scroll
        smoothScroll: true,
        smoothScrollBehavior: function(element) {
          console.log('run "smoothScrollBehavior"...', element)
          element.scrollIntoView({ behavior: 'smooth' }) // default behavior
        }
      })
    }
  </script>
    {% seo %}
  </head>

  <body>

    <div id="layout">
      <header>
        {% include header.html %}
        {% include breadcrumbs.html %}
      </header>

      <div class="layout-inner">
        {%- include sidebar.html -%}
        <main>
          <section>
            {{ content }}
          </section>
          <!-- {% include footer.html %} --commented out until i add in /_includes-->
        </main>
      </div>
    </div>

    <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>

  </body>

</html>
