title: "Wordbite"
email: "tumblr@wordbite.ca"
description: "Wordbite Tumblr Themes & Documentation."

baseurl: ""
url: ""

collections:
  guides:
    output: true
    permalink: /guides/:path/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc

toc:
  min_level: 1
  max_level: 3
  list_class: toc-list
  sublist_class: toc-sublist

markdown: kramdown
highlighter: rouge