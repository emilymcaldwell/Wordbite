title: "Wordbite"
email: "tumblr@wordbite.ca"
description: "Wordbite Tumblr Themes & Documentation."

baseurl: ""
url: ""

collections:
  docs:
    output: true
    permalink: /guides/:path/

defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc

highlighter: rouge
kramdown:
  syntax_highlighter: github