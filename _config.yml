title: "Wordbite"
email: "tumblr@wordbite.ca"
description: "Wordbite Tumblr Themes & Documentation."

baseurl: ""  # Empty for user sites; "/repo-name" for project sites
url: ""

# Collections: custom content types beyond posts
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Front matter defaults eliminate repetition
defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc

# Syntax highlighting
highlighter: rouge
kramdown:
  syntax_highlighter: github